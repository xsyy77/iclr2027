name: temporary-stage23-final-check-v2
on:
  push:
    branches: [main]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Final Stage III full-1240 check
        run: |
          unzip -q iclr2027_review_package_v3.zip -d /tmp/pkg
          cd /tmp/pkg/iclr2027_review_package
          pip -q install pandas numpy networkx
          cat > /tmp/stage3_final.py <<'PY'
          import json, math
          from collections import defaultdict
          from pathlib import Path
          import numpy as np, pandas as pd, networkx as nx
          BASE=Path('/tmp/pkg/iclr2027_review_package'); D=BASE/'data/processed/drugmechdb'
          paths=json.load(open(BASE/'data/raw/drugmechdb/indication_paths.json'))
          man=pd.read_csv(D/'benchmark_manifest.csv')
          cand=pd.read_csv(D/'semantic_bridge_predictions.csv')
          gate=pd.read_csv(D/'semantic_gate_predictions.csv')
          G=nx.MultiDiGraph();gold={}
          for rec in paths:
              rid=str(rec.get('graph',{}).get('_id','')); links=[]
              for n in rec.get('nodes',[]):
                  nid=str(n['id'])
                  if nid not in G:G.add_node(nid)
              for e in rec.get('links',[]):
                  u,v,r=str(e['source']),str(e['target']),str(e.get('key','unknown'))
                  G.add_edge(u,v,relation=r);links.append((u,v,r))
              if rid:gold[rid]=links
          OUT=defaultdict(list)
          for u,v,d in G.edges(data=True):
              t=(v,str(d.get('relation','unknown')))
              if t not in OUT[u]:OUT[u].append(t)
          MAXLOG=max(math.log1p(G.in_degree(n)+G.out_degree(n)) for n in G.nodes) or 1
          def rq(r):
              s=r.lower().replace('_',' ')
              if any(k in s for k in ['causes','prevents','treats','therapeutic']):return 1.
              if any(k in s for k in ['regulates','activity','abundance','inhibits','stimulates','affects']):return .88
              if any(k in s for k in ['participates','produces','has output','capable of','precedes']):return .72
              if any(k in s for k in ['occurs in','located in','location of','correlated','associated']):return .52
              return .62
          def lgs(v,r):return .82*rq(r)+.18*(1-math.log1p(G.in_degree(v)+G.out_degree(v))/MAXLOG)
          def bss(p,c):
              if not c:return 0.
              rr=[n for n in p if n in c]
              if not rr:return 0.
              u=list(dict.fromkeys(rr));cov=len(u)/len(c);mc=np.mean([c[n] for n in u]);cur=c.get(p[-1],0.);recent=sum(n in c for n in p[-2:])/2
              sat=.65 if len(u)<=1 else (.85 if len(u)==2 else 1.)
              return min(1.,max(0.,(.45*cov+.25*mc+.15*cur+.15*recent)*sat))
          def run(src,tgt,c,g):
              beam=[(0.,(src,),(),())];gen={src};ex=0;best=None
              for _ in range(8):
                  nxt=[]
                  for _,pn,pr,pg in beam:
                      for v,r in OUT.get(pn[-1],[]):
                          if ex>=20:break
                          ex+=1
                          if v in pn:continue
                          if v not in gen and len(gen)>=14:continue
                          gen.add(v);nn=pn+(v,);rr=pr+(r,);gg=pg+(lgs(v,r),)
                          sc=(1-g)*np.mean(gg)+g*bss(nn,c)-.012*len(rr);st=(sc,nn,rr,gg);nxt.append(st)
                          if v==tgt and (best is None or sc>best[0]):best=st
                      if ex>=20:break
                  if best is not None:break
                  if not nxt:break
                  nxt.sort(key=lambda x:(x[0],-len(x[1])),reverse=True);beam=nxt[:2]
              z=best if best is not None else (max(beam,key=lambda x:x[0]) if beam else (0.,(src,),(),()))
              _,pn,rr,_=z;return float(pn[-1]==tgt),[(pn[i],pn[i+1],rr[i]) for i in range(len(rr))],pn
          MAN={(r.task,r.rid):r for r in man.itertuples(index=False)}
          CG={(k[0],k[1],k[2],k[3]):d.drop_duplicates('node') for k,d in cand.groupby(['task','rid','split','condition'])}
          GP={(r.task,r.rid,r.split,r.condition):float(r.p_semantic_gate) for r in gate.itertuples(index=False)}
          rows=[]
          for key,d in CG.items():
              task,rid,split,cond=key
              if split!='test':continue
              row=MAN[(task,rid)]; conf=dict(zip(d.node.astype(str),d.pred_semantic_conf.astype(float)));p=GP[key]
              vals={}
              for name,g in [('base',.30),('high',.45)]:
                  ps,e,pn=run(str(row.source),str(row.target),conf,g);ge=set(gold[str(rid)]);er=len(ge&set(e))/max(1,len(ge));ah=float(str(row.answer) in set(pn));vals[name]=(ps,er,ah)
              actual=vals['high'] if p>=.5 else vals['base']
              rows.append({'task':task,'rid':rid,'condition':cond,'p':p,'gate':.45 if p>=.5 else .30,
                           'bps':vals['base'][0],'ber':vals['base'][1],'bah':vals['base'][2],
                           'hps':vals['high'][0],'her':vals['high'][1],'hah':vals['high'][2],
                           'ps':actual[0],'er':actual[1],'ah':actual[2]})
          Z=pd.DataFrame(rows)
          print('N',len(Z),'HIGH_COUNTS',Z[Z.gate>.3].groupby('condition').size().to_dict(),'HIGH_TOTAL',sum(Z.gate>.3))
          print('SUMMARY')
          print(Z.groupby('condition').agg(n=('rid','size'),mean_g=('gate','mean'),PS=('ps','mean'),ER=('er','mean'),AH=('ah','mean'),basePS=('bps','mean'),baseER=('ber','mean'),baseAH=('bah','mean')).to_string())
          print('OVERALL',Z.ps.mean(),Z.er.mean(),Z.ah.mean(),Z.bps.mean(),Z.ber.mean(),Z.bah.mean(),Z.gate.mean())
          for m,bm in [('PS','bps'),('ER','ber'),('AH','bah')]:
              d=(Z[m.lower()] if m!='PS' else Z.ps)-Z[bm]
              print('HARM',m,'improved',int((d>1e-12).sum()),'same',int((abs(d)<=1e-12).sum()),'harmed',int((d<-1e-12).sum()),'harm_rate',float((d<-1e-12).mean()))
          rng=np.random.default_rng(20261022)
          for cond in ['All','Clean','25%','50%','75%','Random']:
              Q=Z if cond=='All' else Z[Z.condition==cond]
              for m,bm in [('PS','bps'),('ER','ber'),('AH','bah')]:
                  a=Q[m.lower()] if m!='PS' else Q.ps; d=(a-Q[bm]).to_numpy(float)
                  ix=rng.integers(0,len(d),(10000,len(d)));zz=d[ix].mean(1);lo,hi=np.quantile(zz,[.025,.975])
                  print('BOOT',cond,m,'DIFF',d.mean(),'CI',lo,hi)
          # condition-stratified shuffled assignment, preserving exact gate counts
          reps=[]
          for rep in range(500):
              ps=[];er=[];ah=[]
              for cond,Q0 in Z.groupby('condition'):
                  Q=Q0.reset_index(drop=True);k=int((Q.gate>.3).sum());idx=set(rng.choice(len(Q),k,replace=False).tolist())
                  for i,r in Q.iterrows():
                      hi=i in idx;ps.append(r.hps if hi else r.bps);er.append(r.her if hi else r.ber);ah.append(r.hah if hi else r.bah)
              reps.append((np.mean(ps),np.mean(er),np.mean(ah)))
          R=np.asarray(reps)
          for j,m in enumerate(['PS','ER','AH']):
              print('SHUFFLE',m,'MEAN',R[:,j].mean(),'SD',R[:,j].std(ddof=1),'Q025',np.quantile(R[:,j],.025),'Q975',np.quantile(R[:,j],.975),'ACTUAL',Z[m.lower()].mean() if m!='PS' else Z.ps.mean(),'FRAC_ACTUAL_GT',float(np.mean((Z[m.lower()].mean() if m!='PS' else Z.ps.mean())>R[:,j])))
          PY
          python /tmp/stage3_final.py
